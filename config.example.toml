# Unknown keys anywhere in this file are fatal startup errors: the service
# rejects misspelled or stray configuration instead of silently ignoring it.
[server]
# Socket address where the standalone HTTP service binds.
bind_address = "127.0.0.1:8091"
# Maximum accepted HTTP request body size before Axum returns 413.
max_request_body_bytes = 16384
# Maximum corpus-relative source reference length accepted by ingest operations.
max_ingest_source_chars = 2048
# Maximum query text length accepted by search operations.
max_search_query_chars = 4096

[logging]
# Service log file. Relative paths resolve from this config file's directory.
file_path = "logs/data-store.log"
# Minimum service log level: trace, debug, info, warn, or error.
level = "info"

[admin]
# Runtime admin bearer token file. Relative paths resolve from this config
# file's directory.
token_file_path = ".data-store-admin-token"

[client]
# Timeout for each single HTTP request the CLI client sends (including each
# poll of GET /operations/{operationId}); it does not cap total polling time.
# The server validates this section but never reads it at runtime; it is
# owned by the bundled data-store CLI client sharing this file.
operation_timeout_seconds = 3600

[inference]
# Accelerator backend to use for model inference. CPU fallback is not supported.
device = "metal"
# Accelerator device index for the selected backend.
device_index = 0

[storage]
# Corpus root containing source files addressed by corpus-relative ingest references.
corpus_root = "/absolute/path/to/corpus"
# Service-owned index root for SQLite storage and Docling conversion artifacts.
index_root = "/absolute/path/to/indexes"

[connectors.filesystem]
# Governance domain stamped on every SourceLocation acquired by the
# filesystem connector (spec §6 reservation 3; an external fact).
governance_domain = "local-corpus"

[docling]
# Python executable for the environment where Docling is installed. The service
# launches docling_path directly, but keeps this path in config so startup and
# failure diagnostics identify the expected Python environment.
python_path = "/absolute/path/to/python"

# Docling executable launched directly for PDF-to-markdown conversion.
docling_path = "/absolute/path/to/docling"

# Per-document Docling processing timeout in seconds. This is passed as
# --document-timeout. Very large books, OCR-heavy PDFs, or table-heavy PDFs may
# need a higher value. If the timeout is reached, Docling aborts and the ingest
# fails without publishing a partial version.
document_timeout_seconds = 7200

# PDF parser backend passed as --pdf-backend.
#
# Valid values:
# - pypdfium2: Uses the PDFium-based parser. This matched the legacy Data Store
#   UI default. Good first choice for text-layer PDFs when you want predictable
#   extraction without Docling's newer parser stack.
# - docling_parse: Docling's default parser backend in the installed CLI. Uses
#   Docling's current parser stack and may provide richer layout recovery, but
#   can be slower or heavier on difficult books.
# - dlparse_v1: Older Docling Parse backend. Keep available for compatibility
#   testing when newer parser versions regress on a specific PDF.
# - dlparse_v2: Newer Docling Parse backend than v1. Use when comparing parser
#   quality or performance against v1/v4/docling_parse.
# - dlparse_v4: Newer Docling Parse backend than v2. Use when testing Docling's
#   more recent parser behavior on layout-heavy PDFs.
pdf_backend = "pypdfium2"

# OCR behavior for bitmap/scanned page content.
#
# Valid values:
# - auto: The service passes no OCR flag and lets Docling's CLI default decide.
#   In the installed Docling CLI, the default is OCR enabled. This may invoke
#   RapidOCR and can be very slow on CPU.
# - on: Passes --ocr and explicitly enables OCR.
# - off: Passes --no-ocr and disables OCR. Best default for text-layer PDFs
#   such as most ebooks, papers, and generated PDFs. Scanned PDFs may produce
#   little or no text with OCR disabled.
ocr_mode = "off"

# Accelerator device passed to Docling as --device. This controls Docling's
# Python/PyTorch-side processing only. It is separate from [inference].device,
# which controls the Rust/Candle embedding and reranking models.
#
# Valid values:
# - auto: Let Docling choose a device. Convenient, but less predictable because
#   device selection depends on the installed Python packages and hardware.
# - cpu: Force CPU execution. Most compatible, but slowest for OCR/model-heavy
#   conversion.
# - cuda: Use NVIDIA CUDA. Relevant on machines with NVIDIA GPUs, CUDA drivers,
#   and a CUDA-enabled PyTorch/Docling environment. Not useful on Apple Silicon.
# - mps: Use Apple's Metal Performance Shaders through PyTorch. Relevant on
#   Apple Silicon when the installed Docling/OCR/model stack supports MPS.
# - xpu: Use Intel's accelerator path for Intel GPUs/XPUs through PyTorch.
#   Relevant only on systems with Intel accelerator support and a compatible
#   Python/PyTorch environment.
device = "mps"

# Number of worker threads passed as --num-threads. This bounds Docling's CPU
# parallelism. Higher values may improve throughput but can increase contention,
# memory pressure, and interference with the Rust service.
num_threads = 10

# Number of pages Docling processes per batch, passed as --page-batch-size.
# Lower values can reduce peak memory usage and isolate problematic pages.
# Higher values can improve throughput when the selected backend/device has
# enough memory.
page_batch_size = 10

[models.dense]
# Dense embedding backend selection. There is no fallback between backends;
# the configured backend is exclusive and misconfiguration is a startup error.
#
# Valid values:
# - local: In-process Candle Qwen3 embedding runtime on the [inference]
#   accelerator. Requires path and max_tokens. The http-only fields
#   (endpoint, model, timeout_seconds, api_key_file_path) must not be set.
# - http: Remote endpoint speaking the OpenAI-compatible embeddings contract
#   (vLLM, TEI, llama.cpp). Requires endpoint, model, and timeout_seconds;
#   api_key_file_path is optional. The local-only fields (path, max_tokens)
#   must not be set. The service sends the same instruction-prefixed text the
#   local runtime would embed and L2-normalizes returned vectors, so query and
#   passage semantics do not fork by backend. Vectors from different backends
#   are not interchangeable within one corpus; switch backends only alongside
#   a fresh ingest.
backend = "local"
# Expected dense embedding vector dimension. Common to both backends; HTTP
# responses are validated against it per call.
dimension = 4096
# Dense pooling contract of the model. The local runtime validates it
# (last-token pooling); for the http backend it records the served model's
# pooling as an operator-stated fact.
pooling = "last_token"
# Local Qwen3 dense embedding model directory. Required when backend = "local".
path = "/absolute/path/to/qwen3-embedding-8b"
# Maximum token count accepted by the local dense runtime. Required when
# backend = "local".
max_tokens = 8192
# HTTP backend example: replace the local fields above with these.
#
# OpenAI-compatible embeddings endpoint URL; must start with http:// or
# https://. Full route URL, not a base URL.
#endpoint = "http://embedding-host:8001/v1/embeddings"
# Model name sent in HTTP embeddings requests.
#model = "qwen3-embedding-8b"
# HTTP embeddings request timeout in seconds.
#timeout_seconds = 60
# Optional owner-only file containing the API key sent as a bearer token.
# Relative paths resolve from this config file's directory.
#api_key_file_path = ".data-store-dense-api-key"

[models.colbert]
# Local ColBERT-Zero model directory.
path = "/absolute/path/to/colbert-zero"
# Expected ColBERT token-vector dimension.
dimension = 128
# Maximum encoded query tokens for ColBERT query embedding.
query_max_tokens = 512
# Maximum encoded document/unit tokens for ColBERT document embedding.
document_max_tokens = 512

[models.reranker]
# Reranker backend selection. There is no fallback between backends; the
# configured backend is exclusive and misconfiguration is a startup error.
#
# Valid values:
# - local: In-process Candle ModernBERT sequence-classification runtime on the
#   [inference] accelerator. Requires path and max_tokens. The http-only fields
#   (endpoint, model, timeout_seconds, api_key_file_path) must not be set.
# - http: Remote endpoint speaking the Cohere-compatible rerank contract
#   (vLLM, Cohere, Jina). Requires endpoint, model, and timeout_seconds;
#   api_key_file_path is optional. The local-only fields (path, max_tokens)
#   must not be set.
backend = "local"
# Local reranker model directory. Required when backend = "local".
path = "/absolute/path/to/qwen3-reranker-4b"
# Maximum token count accepted by the local reranker runtime. Required when
# backend = "local".
max_tokens = 32768
# HTTP backend example: replace the local fields above with these.
#
# Cohere-compatible rerank endpoint URL; must start with http:// or https://.
#endpoint = "https://api.example.com/v1/rerank"
# Model name sent in HTTP rerank requests.
#model = "rerank-model-name"
# HTTP rerank request timeout in seconds.
#timeout_seconds = 60
# Optional owner-only file containing the API key sent as a bearer token.
# Relative paths resolve from this config file's directory.
#api_key_file_path = ".data-store-rerank-api-key"

[models.annotator]
# External OpenAI-compatible chat-completions endpoint used by the annotation
# producers (entity, relation, summary). Exclusive: producer failures park
# annotations as failed for later retry; there is no fallback model or
# endpoint. Full route URL, not a base URL.
endpoint = "http://127.0.0.1:8000/v1/chat/completions"
# Model name sent in request bodies.
model = "annotator-model-name"
# Whole-request timeout for one producer call, in seconds.
timeout_seconds = 120
# Optional owner-only file containing the API key sent as a bearer token.
# Relative paths resolve from this config file's directory.
#api_key_file_path = ".annotator-api-key"
# Producer input budget in characters: section groups larger than this are
# split deterministically before invocation. External fact: size from the
# endpoint model's context window.
max_input_chars = 24000
