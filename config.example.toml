[server]
# Socket address where the standalone HTTP service binds.
bind_address = "127.0.0.1:8091"
# Maximum accepted HTTP request body size before Axum returns 413.
max_request_body_bytes = 16384
# Maximum corpus-relative source reference length accepted by /v1/ingest.
max_ingest_source_chars = 2048
# Maximum query text length accepted by /v1/search.
max_search_query_chars = 4096
# Maximum number of synchronous ingest operations allowed to run at once.
max_in_flight_ingest = 1
# Maximum number of synchronous search operations allowed to run at once.
max_in_flight_search = 1

[logging]
# Service log file. Relative paths resolve from the Rust service root.
file_path = "logs/data-store.log"
# Minimum service log level: trace, debug, info, warn, or error.
level = "info"

[admin]
# Runtime admin bearer token file. Relative paths resolve from the Rust service root.
token_file_path = ".data-store-admin-token"

[client]
# Maximum time the interactive CLI waits for one streamed operation.
operation_timeout_seconds = 3600

[inference]
# Accelerator backend to use for model inference. CPU fallback is not supported.
device = "metal"
# Accelerator device index for the selected backend.
device_index = 0

[storage]
# Corpus root containing source files addressed by corpus-relative ingest references.
corpus_root = "/absolute/path/to/corpus"
# Service-owned index root for SQLite storage and Docling conversion artifacts.
index_root = "/absolute/path/to/indexes"

[docling]
# Python executable for the environment where Docling is installed. The service
# launches docling_path directly, but keeps this path in config so startup and
# failure diagnostics identify the expected Python environment.
python_path = "/absolute/path/to/python"

# Docling executable launched directly for PDF-to-markdown conversion.
docling_path = "/absolute/path/to/docling"

# Per-document Docling processing timeout in seconds. This is passed as
# --document-timeout. Very large books, OCR-heavy PDFs, or table-heavy PDFs may
# need a higher value. If the timeout is reached, Docling aborts and the ingest
# fails without publishing a partial version.
document_timeout_seconds = 7200

# PDF parser backend passed as --pdf-backend.
#
# Valid values:
# - pypdfium2: Uses the PDFium-based parser. This matched the legacy Data Store
#   UI default. Good first choice for text-layer PDFs when you want predictable
#   extraction without Docling's newer parser stack.
# - docling_parse: Docling's default parser backend in the installed CLI. Uses
#   Docling's current parser stack and may provide richer layout recovery, but
#   can be slower or heavier on difficult books.
# - dlparse_v1: Older Docling Parse backend. Keep available for compatibility
#   testing when newer parser versions regress on a specific PDF.
# - dlparse_v2: Newer Docling Parse backend than v1. Use when comparing parser
#   quality or performance against v1/v4/docling_parse.
# - dlparse_v4: Newer Docling Parse backend than v2. Use when testing Docling's
#   more recent parser behavior on layout-heavy PDFs.
pdf_backend = "pypdfium2"

# OCR behavior for bitmap/scanned page content.
#
# Valid values:
# - auto: The service passes no OCR flag and lets Docling's CLI default decide.
#   In the installed Docling CLI, the default is OCR enabled. This may invoke
#   RapidOCR and can be very slow on CPU.
# - on: Passes --ocr and explicitly enables OCR.
# - off: Passes --no-ocr and disables OCR. Best default for text-layer PDFs
#   such as most ebooks, papers, and generated PDFs. Scanned PDFs may produce
#   little or no text with OCR disabled.
ocr_mode = "off"

# Accelerator device passed to Docling as --device. This controls Docling's
# Python/PyTorch-side processing only. It is separate from [inference].device,
# which controls the Rust/Candle embedding and reranking models.
#
# Valid values:
# - auto: Let Docling choose a device. Convenient, but less predictable because
#   device selection depends on the installed Python packages and hardware.
# - cpu: Force CPU execution. Most compatible, but slowest for OCR/model-heavy
#   conversion.
# - cuda: Use NVIDIA CUDA. Relevant on machines with NVIDIA GPUs, CUDA drivers,
#   and a CUDA-enabled PyTorch/Docling environment. Not useful on Apple Silicon.
# - mps: Use Apple's Metal Performance Shaders through PyTorch. Relevant on
#   Apple Silicon when the installed Docling/OCR/model stack supports MPS.
# - xpu: Use Intel's accelerator path for Intel GPUs/XPUs through PyTorch.
#   Relevant only on systems with Intel accelerator support and a compatible
#   Python/PyTorch environment.
device = "mps"

# Number of worker threads passed as --num-threads. This bounds Docling's CPU
# parallelism. Higher values may improve throughput but can increase contention,
# memory pressure, and interference with the Rust service.
num_threads = 10

# Number of pages Docling processes per batch, passed as --page-batch-size.
# Lower values can reduce peak memory usage and isolate problematic pages.
# Higher values can improve throughput when the selected backend/device has
# enough memory.
page_batch_size = 10

[models.dense]
# Local Qwen3 dense embedding model directory.
path = "/absolute/path/to/qwen3-embedding-8b"
# Expected dense embedding vector dimension.
dimension = 4096
# Maximum token count accepted by the dense runtime.
max_tokens = 8192
# Dense pooling contract; this service currently expects last-token pooling.
pooling = "last_token"

[models.colbert]
# Local ColBERT-Zero model directory.
path = "/absolute/path/to/colbert-zero"
# Expected ColBERT token-vector dimension.
dimension = 128
# Maximum encoded query tokens for ColBERT query embedding.
query_max_tokens = 512
# Maximum encoded document/unit tokens for ColBERT document embedding.
document_max_tokens = 512

[models.reranker]
# Local Qwen3 reranker model directory.
path = "/absolute/path/to/qwen3-reranker-4b"
# Maximum token count accepted by the reranker runtime.
max_tokens = 32768

[retrieval]
# Default result count when /v1/search omits topK.
default_top_k = 10
# Maximum result count callers may request.
max_top_k = 100
# Reciprocal Rank Fusion constant used to combine dense and BM25 candidates.
rrf_k = 60
# Dense/BM25 first-stage over-fetch multiplier before RRF and reranking.
candidate_overfetch_multiplier = 3
# Maximum RRF candidate pool sent into ColBERT MaxSim reranking.
colbert_candidate_pool_size = 100
# Minimum unit content length retained as searchable text.
min_search_unit_chars = 400
# Maximum retrieval-unit size, aligned to ColBERT document token capacity.
max_unit_tokens = 512
