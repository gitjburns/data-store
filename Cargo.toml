[package]
name = "data-store-service"
version = "0.1.0"
edition = "2024"
default-run = "data-store-service"

[features]
default = []
cuda = ["candle-core/cuda"]
metal = ["candle-core/metal"]

[[bin]]
name = "data-store"
path = "src/bin/data-store.rs"

[dependencies]
anyhow = "1.0.102"
axum = "0.8.9"
candle-core = "0.10.2"
candle-nn = "0.10.2"
candle-transformers = "0.10.2"
getrandom = "0.3.4"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
rustyline = "17.0.2"
safetensors = "0.7.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
thiserror = "2.0.18"
tokenizers = "0.23.1"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "net", "sync"] }
tokio-stream = "0.1.17"
toml = "1.1.2"
tower-http = { version = "0.6.11", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-normalization = "0.1.24"
